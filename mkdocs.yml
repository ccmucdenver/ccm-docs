site_name: Center for Computational Mathematics
 University of Colorado Denver 
site_url: https://ccm-docs.readthedocs.io/en/latest/ 
repo_url: https://github.com/ccmucdenver/ccm-docs 
edit_uri: edit/main/docs/
site_description: Documentation for computing resources at the CCM
theme:
  name: readthedocs
  # Display code blocks uniformly without automatic syntax colors.
  highlightjs: false
  features:
    - navigation.instant
# Load site color overrides after the theme styles.
extra_css:
  - css/extra.css
plugins:
  - search
  - mkdocstrings:
      handlers:
        # See: https://mkdocstrings.github.io/python/usage/
        python:
          options:
            docstring_style: sphinx
markdown_extensions:
  - markdown_include.include:
      base_path: .
  - admonition
nav:
    - Welcome: index.md
    - Terms and Conditions: TermsandConditions.md
    - Updates:  updates.md
    - Accounts: accounts.md
    - Alderaan Overview: overview.md
    - Connecting to Alderaan:
            - Logging in: access.md
            - JupyterHub: jupyterhub.md
            - Remote Desktop: remote_desktop.md
    - Storage and Data Transfer:
            - File Storage and Transfer: storage.md
            - Globus File Transfer: globus.md
    - Running Jobs:
            - Using Slurm Scheduler: slurm.md
            - Examples: examples.md
    - Software:
            - Installing Software: software.md
            - Environment Modules: modules.md
            - Conda and Python: conda.md
            - Singularity Containers: singularity.md
            - Apache Spark: spark.md
            - Gurobi: gurobi.md
    - Additional Information:
            - External Resources: external.md
            - Facilities, Equipment, and Other Resources: facilities.md
            - How to Edit: pull_request.md
